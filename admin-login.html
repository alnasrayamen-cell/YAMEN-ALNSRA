<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | YAMEN ALNSRA</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: min(420px, 90%);
            padding: 35px;
            background: #181b21;
            border: 1px solid #292e38;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #101217;
            color: white;
            border: 1px solid #303641;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #351a1a;
            color: #ff8d8d;
            border-radius: 10px;
            text-align: center;
        }
        .lock {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="login-box">
        <div class="lock">
            🔐
        </div>
        <div class="logo">
            YAMEN ALNSRA
        </div>
        <div class="subtitle">
            لوحة الإدارة
        </div>
        <form id="loginForm">
            <label for="username">
                اسم المستخدم
            </label>
            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="اسم المستخدم"
                required
            >
            <label for="password">
                كلمة المرور
            </label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="كلمة المرور"
                required
            >
            <button type="submit">
                تسجيل الدخول
            </button>
            <div
                id="errorMessage"
                class="error"
            >
                بيانات الدخول غير صحيحة
            </div>
        </form>
        <div class="footer">
            Admin Panel
        </div>
    </main>
    <script>
        /*
         * واجهة تسجيل الدخول فقط.
         *
         * لن نضع اسم المستخدم أو كلمة المرور
         * داخل هذا الملف.
         *
         * في الخطوة التالية سنربطها بنظام
         * Authentication حقيقي.
         */
        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                const error =
                    document.getElementById("errorMessage");
                error.style.display = "block";
                error.textContent =
                    "سيتم تفعيل تسجيل الدخول الحقيقي بعد ربط قاعدة البيانات.";
            });
    </script>
</body>
</html>
